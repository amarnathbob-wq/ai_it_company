# Vikash Technical Hub - Final Production Sealed Configuration
workflows:
  android-workflow:
    name: Vikash Technical Hub Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Reset and Create Clean Android Assets
        script: |
          # पुरानी कैश फाइलों को जड़ से डिलीट करके नया फ्रेश एंड्रॉइड इन्फ्रास्ट्रक्चर बनाना
          flutter clean
          flutter create . --platforms=android --org com.vikashtechnicalhub
      - name: Fetch Clean Dependencies
        script: |
          flutter pub get
      - name: Build Production Android APK
        script: |
          # बिना किसी पुराने सिंक इश्यू के डायरेक्ट कंपाइल करना
          cd android && ./gradlew clean && cd ..
          flutter build apk --release --no-pub --no-validate-copy
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
