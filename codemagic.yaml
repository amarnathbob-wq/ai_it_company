# Vikash Technical Hub - Auto Resolution Express Build
workflows:
  android-workflow:
    name: Vikash Technical Hub Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Reset and Create Clean Android Assets
        script: |
          flutter clean
          flutter create . --platforms=android --org com.vikashtechnicalhub
      - name: Fetch Clean Dependencies
        script: |
          # यह कमांड किसी भी पुराने वर्ज़न के झगड़े को ऑटोमैटिक ठीक कर देगा
          flutter pub reuse-plugins --no-select || true
          flutter pub get
      - name: Build Production Android APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
