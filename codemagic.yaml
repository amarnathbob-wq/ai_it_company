# Vikash Technical Hub - Final Standard Production Configuration
workflows:
  android-workflow:
    name: Vikash Technical Hub Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Reset and Create Clean Android Assets
        script: |
          flutter clean
          flutter create . --platforms=android --org com.vikashtechnicalhub
      - name: Fetch Clean Dependencies
        script: |
          flutter pub get
      - name: Build Production Android APK
        script: |
          # बिना किसी फालतू या पुराने फ्लैग के बिल्कुल साफ स्टैंडर्ड बिल्ड कमांड
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
