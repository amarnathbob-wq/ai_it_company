# Vikash Technical Hub - Fixed Mobile Express Build Configuration
workflows:
  android-workflow:
    name: Vikash Technical Hub Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      android_ndk: stable
    triggering:
      events:
        - push
    scripts:
      - name: Initialize Android Project Infrastructure
        script: |
          flutter create . --platforms=android --org com.vikashtechnicalhub
      - name: Fetch Dependencies
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          # --no-pub के साथ बिल्ड करने से गड़गड़ी करने वाले नए बिल्ड टूल्स बायपास हो जाते हैं
          flutter build apk --release --no-pub --no-validate-copy
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
