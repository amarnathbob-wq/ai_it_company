# Vikash Technical Hub - Codemagic Mobile Express Build Configuration
workflows:
  android-workflow:
    name: Vikash Technical Hub Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Initialize Android Project Infrastructure
        script: |
          flutter create . --platforms=android
      - name: Fetch Dependencies
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
